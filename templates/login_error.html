<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Exotel Streams Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .card h1 {
            font-size: 22px;
            font-weight: 600;
            color: #ef4444;
            margin-bottom: 12px;
        }

        .card p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .email {
            font-family: monospace;
            background: #0f172a;
            padding: 6px 14px;
            border-radius: 6px;
            display: inline-block;
            margin: 12px 0 20px;
            color: #f1f5f9;
            font-size: 14px;
        }

        .back-link {
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Access Denied</h1>
        <p>This dashboard is restricted to <strong>@{{ domain }}</strong> accounts.</p>
        <div class="email">{{ email }}</div>
        <p>Please sign in with your Futwork Google account.</p>
        <br>
        <a href="/logout" class="back-link">Try a different account</a>
    </div>
</body>
</html>
