<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exotel Live Streams Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #94a3b8;
        }

        .user-info img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        .status-dot.error { background: #ef4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .refresh-info {
            font-size: 13px;
            color: #94a3b8;
        }

        .btn-logout {
            color: #94a3b8;
            font-size: 13px;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid #334155;
            border-radius: 6px;
        }

        .btn-logout:hover { color: #e2e8f0; border-color: #64748b; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px;
        }

        .summary-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 32px;
        }

        .summary-card {
            flex: 1;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .summary-card.total {
            background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
            border-color: #3b82f6;
        }

        .summary-label {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 48px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .summary-card.total .summary-value { color: #60a5fa; }

        .chart-section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .chart-controls {
            display: flex;
            gap: 8px;
        }

        .chart-controls button {
            background: #0f172a;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .chart-controls button.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        .accounts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 24px;
        }

        .account-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
        }

        .account-header {
            padding: 20px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .account-name {
            font-size: 18px;
            font-weight: 600;
        }

        .stream-badge {
            background: #22c55e;
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .stream-badge.zero { background: #64748b; }
        .stream-badge.error { background: #ef4444; }

        .stream-list {
            padding: 16px 24px;
            max-height: 400px;
            overflow-y: auto;
        }

        .empty-state {
            padding: 40px 24px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .error-state {
            padding: 20px 24px;
            text-align: center;
            color: #ef4444;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
        }

        td {
            padding: 12px 16px;
            font-size: 13px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }

        tr:hover td { background: rgba(51, 65, 85, 0.3); }
    </style>
</head>
<body>
    <div class="header">
        <h1>Exotel Live Streams Tracker</h1>
        <div class="header-right">
            <div class="status-dot" id="statusDot"></div>
            <span class="refresh-info" id="refreshInfo">Loading...</span>
            {% if user and user.picture %}
            <div class="user-info">
                <img src="{{ user.picture }}" alt="">
                <span>{{ user.name }}</span>
            </div>
            {% endif %}
            <a href="/logout" class="btn-logout">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="summary-bar">
            <div class="summary-card total">
                <div class="summary-label">Total Active Streams</div>
                <div class="summary-value" id="totalStreams">-</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Futwork 1M</div>
                <div class="summary-value" id="futwork1mCount">-</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Futwork 12M</div>
                <div class="summary-value" id="futwork12mCount">-</div>
            </div>
        </div>

        <!-- 24-hour history chart -->
        <div class="chart-section">
            <div class="chart-header">
                <span class="chart-title">Stream Count History</span>
                <div class="chart-controls">
                    <button onclick="loadHistory(1)" id="btn1h">1H</button>
                    <button onclick="loadHistory(6)" id="btn6h">6H</button>
                    <button onclick="loadHistory(24)" class="active" id="btn24h">24H</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="historyChart"></canvas>
            </div>
        </div>

        <div class="accounts" id="accountsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <div>Fetching stream data...</div>
            </div>
        </div>
    </div>

    <script>
        const REFRESH_INTERVAL = 15000;
        let lastUpdated = null;
        let historyChart = null;
        let currentHours = 24;

        function formatTime(date) {
            return date.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // ---------------------------------------------------------------
        // History chart
        // ---------------------------------------------------------------
        const COLORS = {
            futwork1m:  { line: '#3b82f6', fill: 'rgba(59,130,246,0.1)' },
            futwork12m: { line: '#22c55e', fill: 'rgba(34,197,94,0.1)' },
        };
        const LABELS = { futwork1m: 'Futwork 1M', futwork12m: 'Futwork 12M' };

        async function loadHistory(hours) {
            currentHours = hours;
            document.querySelectorAll('.chart-controls button').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`btn${hours}h`);
            if (btn) btn.classList.add('active');

            try {
                const resp = await fetch(`/api/history?hours=${hours}`);
                if (resp.status === 401) { window.location.href = '/login'; return; }
                const data = await resp.json();

                const datasets = [];
                for (const [key, points] of Object.entries(data)) {
                    datasets.push({
                        label: LABELS[key] || key,
                        data: points.map(p => ({ x: p.ts + 'Z', y: p.count })),
                        borderColor: (COLORS[key] || COLORS.futwork1m).line,
                        backgroundColor: (COLORS[key] || COLORS.futwork1m).fill,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0,
                        borderWidth: 2,
                    });
                }

                if (historyChart) historyChart.destroy();

                historyChart = new Chart(document.getElementById('historyChart'), {
                    type: 'line',
                    data: { datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            x: {
                                type: 'time',
                                time: { tooltipFormat: 'MMM d, HH:mm' },
                                grid: { color: 'rgba(51,65,85,0.4)' },
                                ticks: { color: '#64748b', maxTicksLimit: 12 },
                            },
                            y: {
                                beginAtZero: true,
                                grid: { color: 'rgba(51,65,85,0.4)' },
                                ticks: { color: '#64748b', stepSize: 1 },
                            }
                        },
                        plugins: {
                            legend: { labels: { color: '#94a3b8' } },
                        }
                    }
                });
            } catch (e) {
                console.error('Failed to load history', e);
            }
        }

        // ---------------------------------------------------------------
        // Live streams
        // ---------------------------------------------------------------
        function parseStreams(data) {
            if (data.error) return { error: data.error, streams: [] };
            if (data.ActiveStreams) {
                const streams = data.ActiveStreams.Stream;
                if (!streams) return { streams: [] };
                return { streams: Array.isArray(streams) ? streams : [streams] };
            }
            if (data.TelephonyResponse && data.TelephonyResponse.ActiveStreams) {
                const streams = data.TelephonyResponse.ActiveStreams.Stream;
                if (!streams) return { streams: [] };
                return { streams: Array.isArray(streams) ? streams : [streams] };
            }
            if (typeof data === 'object' && !Array.isArray(data)) {
                return { streams: [], raw: data };
            }
            return { streams: [] };
        }

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = String(str ?? '');
            return d.innerHTML;
        }

        function renderAccountCard(key, label, parsed) {
            const count = parsed.streams ? parsed.streams.length : 0;
            const hasError = !!parsed.error;

            let badgeClass = count > 0 ? '' : 'zero';
            if (hasError) badgeClass = 'error';
            const badgeText = hasError ? 'Error' : `${count} active`;

            let bodyHtml = '';
            if (hasError) {
                bodyHtml = `<div class="error-state">${esc(parsed.error)}</div>`;
            } else if (count === 0) {
                let rawInfo = '';
                if (parsed.raw) {
                    rawInfo = `<br><pre style="text-align:left;font-size:12px;color:#64748b;margin-top:12px;white-space:pre-wrap;">${JSON.stringify(parsed.raw, null, 2)}</pre>`;
                }
                bodyHtml = `<div class="empty-state">No active streams${rawInfo}</div>`;
            } else {
                bodyHtml = `
                    <div class="stream-list">
                        <table>
                            <thead>
                                <tr>
                                    <th>Stream SID</th>
                                    <th>From</th>
                                    <th>To</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${parsed.streams.map(s => `
                                    <tr>
                                        <td><span class="stream-sid">${esc(s.Sid || s.sid || '-')}</span></td>
                                        <td>${esc(s.From || s.from || '-')}</td>
                                        <td>${esc(s.To || s.to || '-')}</td>
                                        <td>
                                            <span class="stream-status">
                                                <span class="dot"></span>
                                                ${esc(s.Status || s.status || 'live')}
                                            </span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>`;
            }

            return `
                <div class="account-card">
                    <div class="account-header">
                        <span class="account-name">${esc(label)}</span>
                        <span class="stream-badge ${badgeClass}">${esc(badgeText)}</span>
                    </div>
                    ${bodyHtml}
                </div>`;
        }

        async function fetchStreams() {
            try {
                const resp = await fetch('/api/streams');
                if (resp.status === 401) { window.location.href = '/login'; return; }
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();

                let totalCount = 0;
                let cardsHtml = '';

                for (const [key, account] of Object.entries(data)) {
                    const parsed = parseStreams(account.data);
                    const count = parsed.streams ? parsed.streams.length : 0;
                    totalCount += count;

                    cardsHtml += renderAccountCard(key, account.label, parsed);

                    const countEl = document.getElementById(`${key}Count`);
                    if (countEl) countEl.textContent = parsed.error ? '!' : count;
                }

                document.getElementById('totalStreams').textContent = totalCount;
                document.getElementById('accountsContainer').innerHTML = cardsHtml;

                lastUpdated = new Date();
                document.getElementById('statusDot').className = 'status-dot';
                document.getElementById('refreshInfo').textContent = `Last updated: ${formatTime(lastUpdated)}`;
            } catch (err) {
                document.getElementById('statusDot').className = 'status-dot error';
                document.getElementById('refreshInfo').textContent = `Error: ${err.message}`;
            }
        }

        // Initial load
        fetchStreams();
        loadHistory(24);

        // Auto-refresh streams every 15s, chart every 5 min
        setInterval(fetchStreams, REFRESH_INTERVAL);
        setInterval(() => loadHistory(currentHours), 300000);

        // Countdown display
        setInterval(() => {
            if (!lastUpdated) return;
            const elapsed = Math.floor((Date.now() - lastUpdated.getTime()) / 1000);
            const remaining = Math.max(0, Math.floor(REFRESH_INTERVAL / 1000) - elapsed);
            document.getElementById('refreshInfo').textContent =
                `Last updated: ${formatTime(lastUpdated)} (refresh in ${remaining}s)`;
        }, 1000);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
</body>
</html>
